<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 740" width="720" height="740" lang="zh-CN" role="img" aria-labelledby="title desc">
  <title id="title">20 个同键请求，由唯一约束裁定为一条新行</title>
  <desc id="desc">二十个使用同一幂等键的 INSERT 请求汇入 PostgreSQL 唯一约束。一次创建成功，十九次冲突不插入，jobs 表最终只有一行。未插入的调用者须按事务与查询策略读取已有任务；唯一约束裁定新行是否可创建，行锁协调已有行的读改写。本图解读本机一次实测，不表示吞吐指标。</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#bdb094" stroke-width="0.6" opacity="0.22"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1L8 5L1 9" fill="none" stroke="#263950" stroke-width="1.5" stroke-linejoin="round"/>
    </marker>
    <g id="request" fill="#fbf5e6" stroke="#263950" stroke-width="1.7">
      <rect width="34" height="32" rx="3"/>
      <path d="M8 10h18M8 17h18M8 24h10" fill="none" opacity="0.65"/>
    </g>
  </defs>
  <rect width="720" height="740" fill="#fbf5e6"/>
  <rect x="16" y="16" width="688" height="708" fill="url(#grid)"/>
  <g font-family="system-ui, 'Microsoft YaHei', sans-serif" fill="#263950">
    <text x="32" y="61" font-size="34" font-weight="750">同一个键，只留一行</text>
    <text x="32" y="101" font-size="24" fill="#4f5b68">20 个并发请求 · 同一幂等键 k-001</text>
    <path d="M32 119H688" stroke="#bdb094" stroke-width="1.2"/>

    <text x="40" y="163" font-size="28" font-weight="700">20 次 INSERT</text>
    <text x="531" y="164" font-size="42" font-weight="750" fill="#8b4f1c">20 → 1</text>

    <!-- Twenty request specimens, arranged as five columns by four rows. -->
    <g>
      <use href="#request" x="40" y="193"/><use href="#request" x="88" y="193"/><use href="#request" x="136" y="193"/><use href="#request" x="184" y="193"/><use href="#request" x="232" y="193"/>
      <use href="#request" x="40" y="239"/><use href="#request" x="88" y="239"/><use href="#request" x="136" y="239"/><use href="#request" x="184" y="239"/><use href="#request" x="232" y="239"/>
      <use href="#request" x="40" y="285"/><use href="#request" x="88" y="285"/><use href="#request" x="136" y="285"/><use href="#request" x="184" y="285"/><use href="#request" x="232" y="285"/>
      <use href="#request" x="40" y="331"/><use href="#request" x="88" y="331"/><use href="#request" x="136" y="331"/><use href="#request" x="184" y="331"/><use href="#request" x="232" y="331"/>
    </g>
    <g fill="none" stroke="#263950" stroke-width="1.8" stroke-linecap="round">
      <path d="M272 209L302 279M272 255L302 279M272 301L302 279M272 347L302 279"/>
      <path d="M302 279H331" marker-end="url(#arrow)"/>
    </g>

    <!-- The constraint gate admits one new row; it is not a row lock. -->
    <rect x="334" y="235" width="151" height="87" rx="5" fill="#f3ddb0" stroke="#263950" stroke-width="2"/>
    <path d="M342 226v105M477 226v105" stroke="#263950" stroke-width="3"/>
    <g fill="#fbf5e6" stroke="#263950" stroke-width="1.5">
      <circle cx="342" cy="244" r="4"/><circle cx="342" cy="311" r="4"/><circle cx="477" cy="244" r="4"/><circle cx="477" cy="311" r="4"/>
    </g>
    <text x="409" y="273" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="27" font-weight="750">UNIQUE</text>
    <text x="409" y="305" text-anchor="middle" font-size="24" fill="#8b4f1c">同一键</text>
    <text x="409" y="363" text-anchor="middle" font-size="26" font-weight="700">唯一约束</text>
    <path d="M486 279H534" fill="none" stroke="#263950" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- A ledger with exactly one highlighted task row. -->
    <path d="M539 195H668L686 213V386H539Z" fill="#fbf5e6" stroke="#263950" stroke-width="2" stroke-linejoin="round"/>
    <path d="M667 195v19h19M551 241h123" fill="none" stroke="#263950" stroke-width="1.5"/>
    <text x="553" y="229" font-family="ui-monospace, Consolas, monospace" font-size="28" font-weight="700">jobs</text>
    <rect x="550" y="258" width="125" height="44" rx="3" fill="#f3ddb0" stroke="#8b4f1c" stroke-width="1.5"/>
    <text x="612" y="287" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="24" font-weight="700">job-001</text>
    <path d="M551 320h123M551 332h123" stroke="#bdb094" stroke-width="1.2"/>
    <text x="612" y="367" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="24">rows = 1</text>

    <path d="M350 322v106H78" fill="none" stroke="#263950" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
    <path d="M58 417l20 20m0-20l-20 20" stroke="#8b4f1c" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M612 388v36" fill="none" stroke="#263950" stroke-width="1.8" marker-end="url(#arrow)"/>
    <path d="M599 440l10 10 19-24" fill="none" stroke="#8b4f1c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="40" y="484" font-size="28" font-weight="700">19 次冲突不插入</text>
    <text x="543" y="484" font-size="28" font-weight="700" fill="#8b4f1c">1 次创建</text>

    <path d="M32 512H688" stroke="#bdb094" stroke-width="1.2"/>
    <text x="32" y="547" font-size="26" font-weight="700">其他调用者如何取得原任务？</text>
    <text x="32" y="585" font-size="24" fill="#4f5b68">按事务与查询策略，读取已有行。</text>
    <path d="M32 607H688" stroke="#bdb094" stroke-width="1.2"/>
    <text x="32" y="638" font-size="24"><tspan font-weight="700" fill="#8b4f1c">唯一约束：</tspan>裁定新行是否可创建。</text>
    <text x="32" y="671" font-size="24"><tspan font-weight="700" fill="#8b4f1c">行锁：</tspan>协调已有行的读改写。</text>
    <text x="32" y="704" font-size="24" fill="#4f5b68">本机一次实测图解 · 不表示吞吐指标</text>
  </g>
</svg>
